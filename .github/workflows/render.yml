name: Render Arabic Reel

on:
  workflow_dispatch:
    inputs:
      payload_b64:
        description: Base64 encoded render payload
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: reel-status-writer
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install --disable-pip-version-check edge-tts requests
      - name: Render moving vertical Reel
        id: render
        continue-on-error: true
        env:
          PAYLOAD_B64: ${{ inputs.payload_b64 }}
        run: python scripts/render.py
      - name: Publish render status
        run: |
          git config user.name "albraa-reel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add status/
          git commit -m "render: publish status ${{ github.run_id }}" || exit 0
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin main && exit 0
            sleep $((attempt * 3))
          done
          exit 1
      - name: Fail job when rendering failed
        if: steps.render.outcome == 'failure'
        run: exit 1
